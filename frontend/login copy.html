<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="municipio-api-base-url" content="">
    <title>Iniciar sesión - Municipio Serranoble</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="assets/imagenes/Logo.jpeg" alt="Municipio Serranoble" class="me-2" height="64">
                    <span>Municipio Serranoble</span>
                </a>
                <a class="nav-link text-white" href="noticias.html">Noticias</a>
            </div>
        </nav>
    </header>
    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <section class="card shadow-sm p-4 w-100" style="max-width: 28rem" aria-labelledby="titulo-login">
            <h1 id="titulo-login" class="h3 fw-bold mb-3">Iniciar sesión</h1>
            <p>Ingresá con tu cuenta municipal para administrar noticias.</p>
            <form id="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input id="email" name="email" type="email" class="form-control" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>
            <p id="login-status" class="mt-3 mb-0" role="status" aria-live="polite"></p>
        </section>
    </main>
    <footer class="bg-dark text-white text-center py-3">
        <div class="container"><p class="mb-0">&copy; 2026 Municipio Serranoble - Todos los derechos reservados</p></div>
    </footer>
    <script src="js/main.js"></script>
    <script src="js/login.js"></script>
</body>
</html>

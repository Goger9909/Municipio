<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de reclamo - Municipio Serranoble</title>
    <meta name="municipio-api-base-url" content="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/styles.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="index.html">Municipio Serranoble</a>
                <a class="btn btn-outline-light ms-auto" href="index.html#tramites">Volver a trámites</a>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1 class="fw-bold text-primary mb-3">Seguimiento de reclamo</h1>
                <p>Ingresá el código que recibiste al registrar tu reclamo para consultar su estado.</p>
                <form id="form-seguimiento" class="card card-body shadow-sm">
                    <label for="codigo-seguimiento" class="form-label">Código de seguimiento</label>
                    <input id="codigo-seguimiento" class="form-control mb-3" autocomplete="off"
                        maxlength="20" required>
                    <button class="btn btn-primary align-self-start" type="submit">Consultar estado</button>
                </form>
                <p id="estado-consulta" class="mt-3" role="status" aria-live="polite"></p>
                <section id="resultado-seguimiento" class="card card-body mt-3" aria-live="polite" hidden></section>
            </div>
        </div>
    </main>

    <script src="js/seguimiento.js"></script>
</body>
</html>
